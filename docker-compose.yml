services:
  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - GROQ_MODEL=openai/gpt-oss-20b
      - GROQ_VISION_MODEL=openai/gpt-oss-20b
      - DB_PATH=/app/storage/bot.sqlite3
    volumes:
      - ./storage:/app/storage
      - ./data/archive:/app/data/archive